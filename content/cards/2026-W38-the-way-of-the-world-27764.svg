<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <radialGradient id="spot" cx="50%" cy="34%" r="62%">
      <stop offset="0%"   stop-color="#e0731f" stop-opacity="0.16"/>
      <stop offset="32%"  stop-color="#e0731f" stop-opacity="0.07"/>
      <stop offset="68%"  stop-color="#e0731f" stop-opacity="0"/>
    </radialGradient>
    <!-- The halo has to fall off. A flat circle at 0.14 reads as a brown disc
         painted on the backdrop — an object, not light. -->
    <radialGradient id="halo">
      <stop offset="0%"   stop-color="#e0731f" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#e0731f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e0731f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="#130b08"/>
  <rect width="1080" height="1350" fill="url(#spot)"/>

  <!-- the bulb -->
  <line x1="540" y1="104" x2="540" y2="162" stroke="#4a4038" stroke-width="3"/>
  <circle cx="540" cy="104" r="72" fill="url(#halo)"/>
  <circle cx="540" cy="104" r="8"  fill="#ffd9a8"/>

  <!-- hard offset shadow: a two-colour print, misregistered -->
  <rect x="82" y="220" width="936" height="900" rx="6" fill="#f2e22b"/>
  <rect x="72" y="210" width="936" height="900" rx="6"
        fill="#f3eee6" stroke="#15110f" stroke-width="3"/>

  <text x="136" y="288" font-family="'Playfair Display',Georgia,serif"
        font-size="54" font-weight="700" fill="#15110f">Mrs Millamant</text>
  <text x="136" y="328" font-family="Montserrat,Helvetica,sans-serif"
        font-size="24" fill="#5a5450">The Way of the World · William Congreve · 1700</text>
  <line x1="136" y1="350" x2="944" y2="350"
        stroke="#dad3c8" stroke-width="2"/>

    <text x="136" y="380" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">Trifles; as liberty to pay and receive</text>
    <text x="136" y="426" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">visits to and from whom I please; to write</text>
    <text x="136" y="472" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">and receive letters, without interrogatories</text>
    <text x="136" y="518" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">or wry faces on your part; to wear what I</text>
    <text x="136" y="564" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">please, and choose conversation with regard</text>
    <text x="136" y="610" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">only to my own taste; to have no obligation</text>
    <text x="136" y="656" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">upon me to converse with wits that I don’t</text>
    <text x="136" y="702" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">like, because they are your acquaintance, or</text>
    <text x="136" y="748" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">to be intimate with fools, because they may</text>
    <text x="136" y="794" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">be your relations. Come to dinner when I</text>
    <text x="136" y="840" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">please, dine in my dressing-room when I’m</text>
    <text x="136" y="886" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">out of humour, without giving a reason. To</text>
    <text x="136" y="932" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">have my closet inviolate; to be sole empress</text>
    <text x="136" y="978" font-family="'Courier Prime','Courier New',monospace" font-size="30" fill="#221c19">of my tea-table, which you must never…</text>

  <text x="136" y="1066" font-family="Montserrat,Helvetica,sans-serif"
        font-size="21" letter-spacing="2" fill="#897e74">1 MIN   ·   DEFIANT   ·   AGE 20s</text>

  <text x="540" y="1254" text-anchor="middle" font-family="Montserrat,Helvetica,sans-serif"
        font-size="26" font-weight="600" letter-spacing="4" fill="#e0731f">GHOST LIGHT</text>
  <text x="540" y="1292" text-anchor="middle" font-family="Montserrat,Helvetica,sans-serif"
        font-size="21" letter-spacing="1" fill="#b5ada3">Full piece in the app · free to read</text>
</svg>